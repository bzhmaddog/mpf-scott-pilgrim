# SonarQube Cloud configuration
# Organization and project key are passed by .github/workflows/sonarqube.yml

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Generated, vendored and runtime files
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.angular/**,\
  vpx/**,\
  certs/**,\
  mpf-config/logs/**,\
  mpf-config/data/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  media-controller/back/specs/**

# Test files (excluded from sources above, indexed as tests here)
sonar.tests=.
sonar.test.exclusions=**/node_modules/**
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  media-controller/back/specs/**

# Coverage (lcov produced by vitest in .github/workflows/sonarqube.yml)
sonar.javascript.lcov.reportPaths=\
  media-controller/back/coverage/lcov.info,\
  media-controller/front/coverage/front/lcov.info

# Not unit-testable: entry points, bootstrap config, tooling scripts, container/infra files
sonar.coverage.exclusions=\
  media-controller/back/src/index.ts,\
  media-controller/front/src/main.ts,\
  media-controller/front/src/app/app.config.ts,\
  media-controller/front/src/app/app.routes.ts,\
  media-controller/front/scripts/**
