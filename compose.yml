name: mpf-scott-pilgrim

services:
  mpf:
    image: localhost/mpf:${TAG:-latest}
    container_name: mpf
    depends_on:
      - mc-front
      - mc-back
    ports:
      - "5051:5051"      
    networks:
      - mpf
    volumes:
      - ./mpf-config:/mpf
    # Image runs as non-root uid 1000: map the host user onto it (podman) so
    # ./mpf-config stays writable.
    userns_mode: "keep-id:uid=1000,gid=1000"
    # Uncomment on the physical machine. The host user must be in the group owning
    # the serial devices (uucp on Arch); keep-groups forwards it into the container:
    #group_add:
    #  - keep-groups
    #devices:
    #  - /dev/cobrapin_board_0
    #  - /dev/cobrapin_board_1

  mc-proxy:
    image: localhost/mc-proxy:${TAG:-latest}
    container_name: mc-proxy
    # Image runs as nginx (uid 101): map the host user onto it (podman) so the
    # bind-mounted certs/current/server.key (0600) stays readable.
    userns_mode: "keep-id:uid=101,gid=101"
    ports:
      - "4443:4443/tcp"
    networks:
      - mc-front
      - mc-back
    volumes:
      - ./certs/current:/certs

  mc-back:
    image: localhost/mc-back:${TAG:-latest}
    init: true
    container_name: mc-back
    networks:
      - mc-back
      - mpf

  mc-front:
    image: localhost/mc-front:${TAG:-latest}
    container_name: mc-front
    networks:
      - mc-front

networks:
  mpf:
  mc-back:
  mc-front:
