name: Front-end CI

on:
  push:
    branches: [main]
    paths:
      - 'docker/media-controller/front/**'
      - '.github/workflows/front-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/media-controller/front/**'
      - '.github/workflows/front-ci.yml'

permissions:
  contents: read

jobs:
  front-ci:
    name: Media Controller Front-end => Lint · Test · Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/media-controller/front

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docker/media-controller/front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test & coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: docker/media-controller/front/coverage/
          retention-days: 14
