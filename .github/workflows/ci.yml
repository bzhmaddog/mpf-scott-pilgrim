name: CI

on:
  push:
    branches: [main]
    paths:
      - 'media-controller/front/**'
      - 'media-controller/back/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.label }} · Lint · Test · Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: front
            label: Front
          - app: back
            label: Back
    defaults:
      run:
        working-directory: media-controller/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-controller/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test & coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ matrix.app }}-coverage-report
          path: media-controller/${{ matrix.app }}/coverage/
          retention-days: 14
