name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            media-controller/front/package-lock.json
            media-controller/back/package-lock.json
      # Generate lcov reports consumed by sonar.javascript.lcov.reportPaths
      - name: Test & coverage (back)
        working-directory: media-controller/back
        run: |
          npm ci --ignore-scripts
          npm run test:coverage
      - name: Test & coverage (front)
        working-directory: media-controller/front
        run: |
          npm ci --ignore-scripts
          npm run test:coverage
      # lcov paths are relative to each app; make them repo-relative for Sonar
      - name: Rewrite lcov paths
        run: |
          sed -i 's|^SF:src/|SF:media-controller/back/src/|' media-controller/back/coverage/lcov.info
          sed -i 's|^SF:src/|SF:media-controller/front/src/|' media-controller/front/coverage/front/lcov.info
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=bzhmaddog
            -Dsonar.projectKey=bzhmaddog_mpf-scott-pilgrim
