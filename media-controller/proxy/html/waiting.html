<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting…</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #1a1a1a; color: #fff; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #444; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p>Front-end is starting, please wait…</p>
  </div>
  <script>
    (function poll() {
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(res => {
          if (res.status !== 503) {
            window.location.reload();
          } else {
            setTimeout(poll, 1000);
          }
        })
        .catch(() => setTimeout(poll, 1000));
    })();
  </script>
</body>
</html>
