[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpf-controller"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "setuptools<78",
    "pillow",
    "mpf==0.80.0.dev5",
    "fastapi",
    "uvicorn",
]

[project.scripts]
mpf-controller = "mpf_controller.app:main"

[tool.setuptools.packages.find]
where = ["src"]
